<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/timbal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before first paint. Light is the default. Only an explicit click on
         ThemeToggle is persisted (key `timbal:theme`, same one the toggle reads);
         nothing is written here, so a default can never leak into storage and
         come back as a "preference" — on this app or on another one sharing the
         origin. To ship a dark-first product, change `mode` here and nothing else. -->
    <script>
      (function () {
        var mode = "light";
        try {
          var stored = window.localStorage.getItem("timbal:theme");
          if (stored === "light" || stored === "dark") mode = stored;
        } catch (e) {}
        document.documentElement.classList.toggle("dark", mode === "dark");
      })();
    </script>
    <!-- Fonts are bundled (src/index.css → @fontsource), not fetched from Google. -->
    <title>Timbal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
