name: UI smoke

on:
  pull_request:
  push:
    branches: [main, v3]

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Registry drift check
        run: bun scripts/registry-build.mjs --check

      - name: Lint
        run: bun run lint

      - name: Build (templates kept for screenshots)
        run: bun run build
        env:
          VITE_TEMPLATES: "true"

      - name: Install playwright chromium
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium

      - name: Screenshot every route (1280 + 375, light + dark)
        run: node scripts/screenshots.mjs --out screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-screenshots
          path: screenshots/
          retention-days: 14
